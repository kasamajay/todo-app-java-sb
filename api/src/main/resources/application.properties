# The route table is exactly the Go API's; everything else is turned off so
# no framework default leaks into the HTTP contract (decisions/0005).
server.port=8080
spring.main.banner-mode=off
server.error.whitelabel.enabled=false
# No /error controller either (Go has no such route - it would answer 500);
# ErrorHandling maps every exception itself.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration
# No static resource handler: unmatched paths raise NoHandlerFoundException,
# which ErrorHandling turns into Go ServeMux's plain-text 404.
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true

# Multipart: parsed lazily (only once the handler asks for the file, after
# its ownership check - same order as the Go handler). Total request capped
# at 10MB + 1024 bytes of multipart overhead, like Go's MaxBytesReader; the
# 10MB per-file limit is checked in AttachmentsController.
spring.servlet.multipart.resolve-lazily=true
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=10486784
# Let Tomcat read (and discard) an oversized body so the client gets the 413
# response instead of a connection reset.
server.tomcat.max-swallow-size=-1

# Same data dir / Google settings as the Go API's env vars (AppConfig treats
# an empty value as unset, like Go's getEnv).
todo.data-dir=${DATA_DIR:./data}
todo.google.client-id=${GOOGLE_CLIENT_ID:}
todo.google.client-secret=${GOOGLE_CLIENT_SECRET:}
todo.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
todo.frontend-base-url=${FRONTEND_BASE_URL:}
todo.addr=${ADDR::8080}

# Go's log package format: "2006/01/02 15:04:05 message"
logging.pattern.console=%d{yyyy/MM/dd HH:mm:ss} %msg%n
logging.level.root=WARN
logging.level.todo-app=INFO
logging.level.org.springframework.boot.devtools=INFO
# Dev only (devtools isn't in the packaged jar): restart when dev-watch.sh
# touches this file after a *successful* compile, never mid-compile while
# class files are being rewritten (decisions/0008).
spring.devtools.livereload.enabled=false
spring.devtools.restart.trigger-file=.reloadtrigger
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR
